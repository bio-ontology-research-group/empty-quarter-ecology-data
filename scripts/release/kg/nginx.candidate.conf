map $http_accept $kg_rdf {
    default 0;
    "~*(application/rdf\+xml|text/turtle|application/ld\+json|application/n-triples|application/n-quads)" 1;
}
map $http_accept $kg_html {
    default 0;
    "~*text/html" 1;
}
map $http_accept $kg_version_document {
    default /downloads/kg/3.0.0/manifest.json;
    "~*text/turtle[^,]*;[ ]*q=0([.]0*)?([ ]*;|[ ]*,|[ ]*$)" /downloads/kg/3.0.0/manifest.json;
    "~*(^|,)[ ]*text/turtle[ ]*(;|,|$)" /downloads/kg/3.0.0/service-description.ttl;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /kg-release.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /service-description.ttl {
        alias /release-public/service-description.ttl;
        default_type text/turtle;
        add_header Access-Control-Allow-Origin "*";
    }
    location = /sparql {
        set $description "${request_method}${arg_query}${kg_html}";
        if ($description = "GET1") { rewrite ^ /index.html last; }
        if ($description = "GET0") { rewrite ^ /service-description.ttl last; }
        proxy_pass http://eq_kg_3_0_0_protocol_backend:8000/sparql;
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://eq_kg_3_0_0_protocol_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /downloads/kg/ {
        alias /release-public/kg/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /downloads/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*";
    }
    location = /kb/v3.0.0/ {
        absolute_redirect off;
        add_header Vary Accept always;
        return 303 $kg_version_document;
    }
    location = /downloads/kg/3.0.0/service-description.ttl {
        alias /release-public/kg/3.0.0/service-description.ttl;
        types { }
        default_type text/turtle;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /kb/ {
        if ($kg_rdf) {
            rewrite ^/kb/(.*)$ /sparql?query=DESCRIBE+%3Chttps://rubalkhali.science/kb/$1%3E last;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location /ontology/ {
        if ($kg_rdf) {
            rewrite ^/ontology/(.*)$ /sparql?query=DESCRIBE+%3Chttps://rubalkhali.science/ontology/$1%3E last;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /gallery { try_files /index.html =404; }
    location = /gallery/ { try_files /index.html =404; }
    location ~ ^/(gallery|audio|tracks|twin-data)/.+\.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
