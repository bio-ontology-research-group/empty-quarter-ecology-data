metadata:
  version: 2026-07-23
  audit_date: "2026-07-23"
  policy: >-
    Element channels map to neutral atom classes; oxide channels map to the
    matching neutral oxide when present in the pinned ChEBI release. LE is an
    instrument pseudo-analyte and is intentionally unmapped. A null ChEBI
    value means that no formula-matching class was found in the pinned
    release; it must not be filled by label similarity or an invented IRI.
  chebi_source: data/ontologies/chebi.owl
  pubchem_snapshot: config/codes/xrf_pubchem_snapshot.json
