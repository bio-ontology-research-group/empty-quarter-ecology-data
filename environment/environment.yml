name: empty-quarter-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.14
  - openjdk=21.0.10
  - groovy=4_0_28
  - pandas=2.2.3
  - numpy=2.1.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - scikit-bio=0.7.3
  - statsmodels=0.14.6
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - networkx=3.4.2
  - biopython=1.84
  - biom-format=2.1.16
  - openpyxl=3.1.5
  - rdflib=7.1.4
  - pyyaml=6.0.3
  - requests=2.32.3
  - pytest=8.3.5
  - graphviz=12
  - python-graphviz=0.20.3
  # Raptor 2.0.16 is built from its checksum-pinned upstream source archive by
  # workflow/bin/bootstrap_raptor.sh because it is not a Conda dependency.
  - mafft=7.526
  - fasttree=2.1.11
  - r-base=4.4
  - r-vegan=2.6_8
  - r-lme4=1.1_35.5
  - r-emmeans=1.10
  - r-permute=0.9_7
  - pip
  - pip:
      - pingouin==0.5.5
